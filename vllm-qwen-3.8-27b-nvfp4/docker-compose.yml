# Pinned project name: decouples compose state (volumes, networks) from the folder name.
name: vllm-qwen-38-27b-nvfp4

services:
  vllm:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: vllm-qwen-server
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 600s

    networks:
      - vllm-net

    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    environment:
      - VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS
      - VLLM_FLASHINFER_AUTOTUNE_CACHE_DIR

      # WSL2 only: Enables non-blocking per-step host -> device
      # staging of attention metadata. Also required for UVA / V2 model runner.
      - VLLM_WSL2_ENABLE_PIN_MEMORY=0

      # Model runner selection at boot: 0 = V1 (Qwen3.8 default),
      # 1 = V2. V2 [Experimental] requires VLLM_WSL2_ENABLE_PIN_MEMORY=1 (UVA) above.
      - VLLM_USE_V2_MODEL_RUNNER=0

      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - MODEL_NAME
      # Pass-through: if set in .env the entrypoint uses this key; if empty the
      # entrypoint generates and persists sk-<uuid> in the vllm-keys volume.
      - VLLM_API_KEY
      - ENABLE_API_KEY
      - DTYPE
      - SAFETENSORS_LOAD_STRATEGY
      - TP_SIZE
      - ATTENTION_BACKEND
      - PERFORMANCE_MODE
      - LANGUAGE_MODEL_ONLY
      - SKIP_MM_PROFILING
      - KV_CACHE_DTYPE
      - GPU_MEMORY_UTILIZATION
      - MAX_MODEL_LEN
      - MAX_NUM_SEQS
      - VLLM_MAX_N_SEQUENCES
      - MAX_NUM_BATCHED_TOKENS
      - ENABLE_CHUNKED_PREFILL
      - ENABLE_PREFIX_CACHING
      - ENABLE_HYBRID_KV_CACHE_MANAGER
      - REASONING_PARSER
      - DEFAULT_ENABLE_THINKING=false
      - DEFAULT_PRESERVE_THINKING
      - ENABLE_AUTO_TOOL_CHOICE
      - TOOL_CALL_PARSER
      - QUANTIZATION
      - ENABLE_MTP
      - MTP_NUM_SPECULATIVE_TOKENS
      - TRUST_REMOTE_CODE
      - ENABLE_PROMPT_TOKENS_DETAILS
      - ENABLE_REQUEST_METRICS
      - DISABLE_LOG_STATS
      - PORT
      # --- HuggingFace ---
      - HF_TOKEN

    volumes:
      # Default fallback = Unsloth cache (matches documented default variant).
      - ${HF_CACHE_VOLUME:-hf-cache-unsloth}:/root/.cache/huggingface
      - vllm-keys:/root/.vllm-key

    ports:
      - "1235:8000"

    ipc: host

networks:
  vllm-net:
    attachable: true

volumes:
  # Explicit names = deterministic volumes (the project name is pinned above),
  # so state survives even if the folder or compose file moves.
  hf-cache-nvidia:
    name: vllm-qwen-38-27b-nvfp4_hf-cache-nvidia
  hf-cache-unsloth:
    name: vllm-qwen-38-27b-nvfp4_hf-cache-unsloth
  vllm-keys:
    name: vllm-qwen-38-27b-nvfp4_vllm-keys
