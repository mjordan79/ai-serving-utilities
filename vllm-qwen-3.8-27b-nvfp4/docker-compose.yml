# Pinned project name: decouples compose state (volumes, networks) from the folder name.
name: vllm-qwen-38-27b-nvfp4

services:
  vllm:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: vllm-server
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 600s

    networks:
      - vllm-net

    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    environment:
      - VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS=0
      - VLLM_FLASHINFER_AUTOTUNE_CACHE_DIR="/tmp/flashinfer_autotune_cache"

      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - MODEL_NAME=${MODEL_NAME:-unsloth/Qwen3.8-27B-NVFP4}
      # Pass-through: if set in .env the entrypoint uses this key; if empty the
      # entrypoint generates and persists sk-<uuid> in the vllm-keys volume.
      - VLLM_API_KEY=${VLLM_API_KEY:-}
      - ENABLE_API_KEY=true
      - DTYPE=auto
      - SAFETENSORS_LOAD_STRATEGY=prefetch
      - TP_SIZE=1
      - ATTENTION_BACKEND=flashinfer
      - PERFORMANCE_MODE=interactivity
      - LANGUAGE_MODEL_ONLY=false
      - SKIP_MM_PROFILING=true
      - KV_CACHE_DTYPE=fp8_e4m3
      - GPU_MEMORY_UTILIZATION=0.92
      - MAX_MODEL_LEN=${MAX_MODEL_LEN:-116800}
      - MAX_NUM_SEQS=1
      - MAX_NUM_BATCHED_TOKENS=6144
      - ENABLE_CHUNKED_PREFILL=true
      - ENABLE_PREFIX_CACHING=true
      - ENABLE_HYBRID_KV_CACHE_MANAGER=true
      - REASONING_PARSER=qwen3
      - DEFAULT_ENABLE_THINKING=true
      - ENABLE_AUTO_TOOL_CHOICE=true
      - TOOL_CALL_PARSER=qwen3_coder
      # Default fallback = Unsloth variant (matches MODEL_NAME default and docs).
      # NVIDIA variant: set QUANTIZATION=modelopt + HF_CACHE_VOLUME=hf-cache-nvidia in .env.
      - QUANTIZATION=${QUANTIZATION:-compressed-tensors}
      - ENABLE_MTP=true
      - MTP_NUM_SPECULATIVE_TOKENS=2
      - TRUST_REMOTE_CODE=true
      - ENABLE_PROMPT_TOKENS_DETAILS=true
      - ENABLE_REQUEST_METRICS=true
      - PORT=8000
      # --- HuggingFace ---
      - HF_TOKEN=${HF_TOKEN}

    volumes:
      # Default fallback = Unsloth cache (matches documented default variant).
      - ${HF_CACHE_VOLUME:-hf-cache-unsloth}:/root/.cache/huggingface
      - vllm-keys:/root/.vllm-key

    ports:
      - "1235:8000"

    shm_size: "16gb"
    ipc: host

networks:
  vllm-net:
    attachable: true

volumes:
  hf-cache-nvidia:
  hf-cache-unsloth:
  vllm-keys:
