services:
  vllm:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: vllm-server

    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - MODEL_NAME=nvidia/Qwen3.6-27B-NVFP4
      - TP_SIZE=1
      - MAX_MODEL_LEN=180800
      - MAX_NUM_SEQS=1
      - MAX_NUM_BATCHED_TOKENS=6144
      - GPU_MEMORY_UTILIZATION=0.94
      # Set to "false" if MTP fails due to missing weights
      - ENABLE_MTP=true
      # Do you need to an API key protecting this model? (Read the README for more details)
      - ENABLE_API_KEY=true
      - ENABLE_REQUEST_METRICS=false
      # The HuggingFace token should be placed in the .env file
      - HF_TOKEN=${HF_TOKEN}

    volumes:
      - /root/.cache/huggingface:/root/.cache/huggingface
      - /root/.vllm-key:/root/.vllm-key

    ports:
      - "1235:8000"

    shm_size: "16gb"
    ipc: host

networks:
  vllm-net:
    attachable: true

