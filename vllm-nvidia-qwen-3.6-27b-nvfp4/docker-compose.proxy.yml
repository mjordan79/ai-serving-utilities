# Reverse Proxy + HTTPS overlay
# Usage: docker compose -f docker-compose.yml -f docker-compose.proxy.yml up -d

services:
  vllm:
    # Pass Let's Encrypt vars to vllm (read by acme-companion via Docker socket)
    environment:
      - LETSENCRYPT_HOST=${LETSENCRYPT_DOMAIN:-}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL:-}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 480s

  docker-gen:
    image: nginxproxy/docker-gen:0.17.2
    container_name: vllm-docker-gen
    restart: unless-stopped

    networks:
      - vllm-net

    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./docker-gen/template.tmpl:/etc/docker-gen/templates/template.tmpl:ro

    command: -watch /etc/docker-gen/templates/template.tmpl /dev/null

    depends_on:
      - nginx

    labels:
      - "com.github.nginx-proxy.docker-gen=true"

  nginx:
    image: nginx:1.27-alpine
    container_name: vllm-nginx
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    environment:
      - LETSENCRYPT_DOMAIN=${LETSENCRYPT_DOMAIN:-}

    networks:
      - vllm-net

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx-certs:/etc/nginx/certs
      - nginx-html:/usr/share/nginx/html

    # Bootstrap: symlink domain-specific certs to generic names, or generate self-signed placeholder.
    # Acme-companion creates domain-specific certs (e.g., mydomain.duckdns.org.crt).
    # This entrypoint creates cert.pem/key.pem symlinks so nginx config stays static (git-safe).
    entrypoint: >
      /bin/sh -c '
        if [ -n "$LETSENCRYPT_DOMAIN" ] && [ -f "/etc/nginx/certs/$LETSENCRYPT_DOMAIN.crt" ]; then
          echo "[nginx] Linking $LETSENCRYPT_DOMAIN certs to generic names..."
          ln -sf "/etc/nginx/certs/$LETSENCRYPT_DOMAIN.crt" /etc/nginx/certs/cert.pem
          ln -sf "/etc/nginx/certs/$LETSENCRYPT_DOMAIN.key" /etc/nginx/certs/key.pem
        elif [ ! -f /etc/nginx/certs/cert.pem ]; then
          echo "[nginx] No certificate found, installing openssl and generating placeholder..."
          apk add --no-cache openssl
          openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
            -keyout /etc/nginx/certs/key.pem \
            -out /etc/nginx/certs/cert.pem \
            -subj "/CN=localhost"
          echo "[nginx] Placeholder certificate generated. Acme-companion will replace it."
        fi
        exec /docker-entrypoint.sh nginx -g "daemon off;"
      '

    depends_on:
      - vllm

  acme-companion:
    image: nginxproxy/acme-companion:2.8.2
    container_name: vllm-acme
    restart: unless-stopped

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - nginx-certs:/etc/nginx/certs
      - nginx-html:/usr/share/nginx/html
      - acme-data:/etc/acme.sh

    environment:
      - NGINX_PROXY_CONTAINER=vllm-nginx
      - NGINX_DOCKER_GEN_CONTAINER=vllm-docker-gen
      - DEFAULT_EMAIL=${LETSENCRYPT_EMAIL:-}

    networks:
      - vllm-net

    depends_on:
      - nginx
      - docker-gen

networks:
  vllm-net:
    attachable: true

volumes:
  nginx-certs:
  nginx-html:
  acme-data:
