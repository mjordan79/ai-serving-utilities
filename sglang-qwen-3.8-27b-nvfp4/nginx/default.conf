# WebSocket connection upgrade map
# $http_upgrade is empty for non-WebSocket requests → "close" (correct for plain HTTP).
# The previously hardcoded "upgrade" sent Connection: upgrade on EVERY proxied request.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream sglang {
    server sglang-qwen-server:30000;
    # Reuse upstream sockets (requires proxy_http_version 1.1, set per location).
    keepalive 16;
}

# Per-client rate limit for the SGLang API (applied in the /v1 location
# below).
# 10 req/s with burst 20 is far above a legitimate single-tenant chat
# workload; beyond the burst nginx returns 503.
limit_req_zone $binary_remote_addr zone=vllm_api:10m rate=10r/s;

# HTTP → redirect HTTPS (except ACME challenge)
server {
    listen 80;
    server_name _;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    # Everything else → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS → reverse proxy to SGLang
server {
    listen 443 ssl;
    # HTTP/2 via ALPN (nginx >= 1.25.1 syntax). Negligible gain on single-stream
    # SSE workloads, but enables h2 at zero cost. h2c on port 80: not needed
    # (redirect-only).
    http2 on;
    server_name _;

    # SSL certificates (provided by acme-companion, symlinked from domain-specific certs)
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    # SSL hardening — Mozilla "Intermediate" profile (AEAD-only suites)
    # TLS 1.3 suites are always AEAD and decided by OpenSSL: ssl_ciphers does not govern them.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    # Client chooses (mandatory in TLS 1.3; avoids Logjam-style side channel in 1.2)
    ssl_prefer_server_ciphers off;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;

    # TLS session resumption (cache off by default → every handshake was full)
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    # Tickets off: static key, no forward secrecy
    ssl_session_tickets off;

    # OCSP stapling
    # resolver is REQUIRED: without it, stapling fails silently.
    # Container nginx does NOT use the host DNS: at runtime it resolves the OCSP
    # responder hostname only through these public resolvers (Cloudflare, Quad9).
    # If the network egress blocks them (firewall/corporate VPN), swap this line
    # for a reachable resolver (e.g. host.docker.internal:53).
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 9.9.9.9 valid=300s;
    resolver_timeout 5s;

    # HSTS
    # No includeSubDomains: no subdomains of your DuckDNS domain exist (it would be inert)
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    # Cap request bodies (nginx default is 1m; 4m covers the full ~128k-token
    # context with margin and bounds abuse).
    client_max_body_size 4m;

    # Stage request bodies in memory up to the cap so they are never spooled
    # to /var/cache/nginx/client_temp. Default client_body_buffer_size is
    # 8-16k (one memory page): any body larger than that is written to a
    # temp file AND logged as [warn] — that is the temp-file warning, and it
    # is independent of client_max_body_size (which only sets the 413 limit).
    # Memory worst case is burst-bounded: <=21 in-flight x 4m ~= 84m.
    client_body_buffer_size 4m;

    # Allow /health — required by external tools, load balancers, and monitoring
    # No sensitive data exposed; proxied like any other request
    location /health {
        proxy_pass http://sglang;
        proxy_http_version 1.1;
    }

    # Block info-leak endpoints (no auth required upstream — deny externally)
    # /version → CVE fingerprinting
    # /metrics → Prometheus: usage patterns, latency, token counts
    # /load → internal server state
    location ~ ^/(version|metrics|load)$ {
        return 403;
    }

    # Block common enumeration targets (including OpenAPI docs, enabled by
    # default by SGLang and leaking the full API schema)
    location ~ ^/(\.env|config|settings|api/auth|docs|redoc|openapi\.json) {
        return 403;
    }

    # Root: dead-end page, served as 200. Static files from the ../dead-end/web
    # bind mount (see docker-compose.proxy.yml). The page deliberately says
    # nothing about the service behind this host — no endpoint names, no
    # auth, no tech. Each asset it references needs its own explicit
    # location here — anything not matched above falls through to the
    # 404 default below.
    location = / {
        root /usr/share/nginx/html/dead-end;
        try_files /index.html =404;
    }

    location = /style.css {
        root /usr/share/nginx/html/dead-end;
        try_files /style.css =404;
    }

    location = /shell.js {
        root /usr/share/nginx/html/dead-end;
        try_files /shell.js =404;
    }

    location = /graph.js {
        root /usr/share/nginx/html/dead-end;
        try_files /graph.js =404;
    }

    # Reverse proxy to SGLang — allowlist (auth enforced upstream by --api-key)
    #
    # Only /v1/* (OpenAI-compatible) is proxied. SGLang also exposes a native
    # surface (/generate, /get_model_info, /server_info, /metrics, ...) that
    # the clients never use; hiding it behind 404 removes an unauthenticated
    # attack surface even though --api-key guards it. Probe the unauth
    # surface once at first activation (see README).
    location ~ ^/v1(/|$) {
        proxy_pass http://sglang;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (for streaming)
        # $connection_upgrade resolved by the map at the top: upgrade only when the client requests it
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Disable buffering for SSE streaming responses
        proxy_buffering off;

        # Timeout for long-running generation
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        limit_req zone=vllm_api burst=20 nodelay;
    }

    # Default: anything not explicitly allowed above (dead-end page, /health,
    # /v1/*) → 404. No proxy, no endpoint enumeration.
    location / {
        return 404;
    }
}
