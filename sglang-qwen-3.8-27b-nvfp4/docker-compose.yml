# Pinned project name: decouples compose state (volumes, networks) from the folder name.
name: sglang-qwen-38-27b-nvfp4

services:
  sglang:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: sglang-qwen-server
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:30000/health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 600s

    networks:
      - sglang-net

    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - MODEL_NAME
      - TP_SIZE
      - CONTEXT_LENGTH
      - CHUNKED_PREFILL_SIZE
      # Pass-through: if set in .env the entrypoint uses this key; if empty the
      # entrypoint generates and persists sk-<uuid> in the sglang-keys volume.
      # (Name kept as VLLM_API_KEY for exact parity with the sibling vLLM stacks.)
      - VLLM_API_KEY
      - ENABLE_API_KEY
      - KV_CACHE_DTYPE
      - MEM_FRACTION_STATIC
      - ATTENTION_BACKEND
      - MAX_RUNNING_REQUESTS
      - MAX_MAMBA_CACHE_SIZE
      - REASONING_PARSER
      - TOOL_CALL_PARSER
      - MAMBA_SSM_DTYPE
      - MAMBA_RADIX_CACHE_STRATEGY
      - ALLOW_AUTO_TRUNCATE
      - TRUST_REMOTE_CODE
      # JSON model-config overrides (--json-model-override-args). Default in the
      # entrypoint disables the vision tower; set in .env to {} to re-enable it.
      - JSON_MODEL_OVERRIDE_ARGS
      # --- DSpark v2 speculative decoding ---
      - SPECULATIVE_ALGORITHM
      - SPECULATIVE_DRAFT_MODEL_PATH
      - SPECULATIVE_DSPARK_BLOCK_SIZE
      - SPECULATIVE_DRAFT_MODEL_QUANTIZATION
      - PORT
      # --- HuggingFace ---
      - HF_TOKEN

    volumes:
      - ${HF_CACHE_VOLUME:-hf-cache-gittensor}:/root/.cache/huggingface
      - sglang-keys:/root/.sglang-key

    ports:
      - "1238:30000"

    ipc: host

networks:
  sglang-net:
    attachable: true

volumes:
  # Explicit names = deterministic volumes (the project name is pinned above),
  # so state survives even if the folder or compose file moves.
  hf-cache-gittensor:
    name: sglang-qwen-38-27b-nvfp4_hf-cache-gittensor
  sglang-keys:
    name: sglang-qwen-38-27b-nvfp4_sglang-keys
