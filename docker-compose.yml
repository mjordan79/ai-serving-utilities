services:
  vllm:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: vllm-server

    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1          # 1 GPU, come da requisito
              capabilities: [gpu]

    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - MODEL_NAME=nvidia/Qwen3.6-27B-NVFP4
      - TP_SIZE=1
      # Valori prudenti per 32GB di VRAM (RTX 5090).
      - MAX_MODEL_LEN=180800
      - MAX_NUM_SEQS=1
      - MAX_NUM_BATCHED_TOKENS=6144
      - GPU_MEMORY_UTILIZATION=0.94
      # Metti a "false" se al primo avvio l'MTP fallisce per pesi mancanti
      # (vedi nota in entrypoint.sh: non confermato per questo checkpoint).
      - ENABLE_MTP=true
      - ENABLE_API_KEY=true
      - ENABLE_REQUEST_METRICS=false
      # Il valore vero va messo in un file .env (vedi sotto), non qui.
      - HF_TOKEN=${HF_TOKEN}

    volumes:
      - /root/.cache/huggingface:/root/.cache/huggingface
      - /root/.vllm-key:/root/.vllm-key

    ports:
      - "1235:8000"

    shm_size: "16gb"
    ipc: host
