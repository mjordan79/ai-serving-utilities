upstream muse {
    server muse-server:8000;
}

# HTTP → redirect HTTPS (except ACME challenge)
server {
    listen 80;
    server_name _;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    # Everything else → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS → reverse proxy to vLLM
server {
    listen 443 ssl;
    server_name _;

    # SSL certificates (provided by acme-companion, symlinked from domain-specific certs)
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    # SSL hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    # Allow /health — required by external tools, load balancers, and monitoring
    # No sensitive data exposed; proxied like any other request
    location /health {
        proxy_pass http://muse;
        proxy_http_version 1.1;
    }

    # Block info-leak endpoints (no auth required upstream — deny externally)
    # /version → CVE fingerprinting
    # /metrics → Prometheus: usage patterns, latency, token counts
    # /load → internal server state
    location ~ ^/(version|metrics|load)$ {
        return 403;
    }

    # Block common enumeration targets
    location ~ ^/(\.env|config|settings|api/auth) {
        return 403;
    }

    # Reverse proxy to vLLM (only /v1/* API endpoints — requires auth)
    location / {
        proxy_pass http://muse;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (for streaming)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Disable buffering for SSE streaming responses
        proxy_buffering off;

        # Timeout for long-running generation
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
