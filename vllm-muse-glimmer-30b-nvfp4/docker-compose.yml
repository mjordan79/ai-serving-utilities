# Pinned project name: decouples compose state (volumes, networks) from the folder name.
name: vllm-muse-glimmer-30b-nvfp4

services:
  vllm:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: vllm-museglimmer-server
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 600s

    networks:
      - muse-net

    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    environment:
      - VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS
      - VLLM_FLASHINFER_AUTOTUNE_CACHE_DIR
      # V2 model runner UVA buffer check fails on WSL2 → force V1 runner
      - VLLM_USE_V2_MODEL_RUNNER=0
      # Disable mm processor cache to avoid "video placeholders" bug on vLLM dev build
      - EXTRA_ARGS_STR=--mm-processor-cache-gb 0

      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - MODEL_NAME
      # Pass-through: if set in .env the entrypoint uses this key; if empty the
      # entrypoint generates and persists sk-<uuid> in the vllm-muse-keys volume.
      - VLLM_API_KEY
      - ENABLE_API_KEY
      - DTYPE
      - SAFETENSORS_LOAD_STRATEGY
      - TP_SIZE
      - ATTENTION_BACKEND
      - PERFORMANCE_MODE
      - KV_CACHE_DTYPE
      - GPU_MEMORY_UTILIZATION
      - MAX_MODEL_LEN
      - MAX_NUM_SEQS
      - MAX_NUM_BATCHED_TOKENS
      - ENABLE_CHUNKED_PREFILL
      - ENABLE_PREFIX_CACHING
      - ENABLE_HYBRID_KV_CACHE_MANAGER
      - REASONING_PARSER
      - TOOL_CALL_PARSER
      - GENERATION_CONFIG
      - ENABLE_AUTO_TOOL_CHOICE
      - QUANTIZATION
      # Speculative decoding (DFlash) — off by default, see entrypoint.
      - ENABLE_SPEC_DECODING
      - SPEC_METHOD
      - SPEC_MODEL
      - SPEC_NUM_TOKENS
      - TRUST_REMOTE_CODE
      - ENABLE_PROMPT_TOKENS_DETAILS
      - ENABLE_REQUEST_METRICS
      - DISABLE_LOG_STATS
      - PORT
      # --- HuggingFace ---
      - HF_TOKEN

    volumes:
      - hf-cache-museglimmer:/root/.cache/huggingface
      - vllm-muse-keys:/root/.vllm-key

    ports:
      - "1236:8000"

    ipc: host

networks:
  muse-net:
    attachable: true

volumes:
  # Explicit names = deterministic volumes (the project name is pinned above),
  # so state survives even if the folder or compose file moves.
  hf-cache-museglimmer:
    name: vllm-muse-glimmer-30b-nvfp4_hf-cache-museglimmer
  vllm-muse-keys:
    name: vllm-muse-glimmer-30b-nvfp4_vllm-muse-keys
