# Reverse Proxy + HTTPS overlay
# Usage: docker compose -f docker-compose.yml -f docker-compose.proxy.yml up -d
#
# NOTE: this overlay binds host ports 80/443. It cannot coexist with the
# Qwen proxy overlay (same ports) — stop the other project's proxy first.

services:
  vllm:
    # Disable direct port exposure in proxy mode — traffic routes through nginx only.
    ports: []

    # Pass Let's Encrypt vars to vllm (read by acme-companion via Docker socket)
    environment:
      - VIRTUAL_HOST=${LETSENCRYPT_DOMAIN}
      - VIRTUAL_PORT=8000
      - LETSENCRYPT_HOST=${LETSENCRYPT_DOMAIN}
      - LETSENCRYPT_EMAIL

  docker-gen:
    image: nginxproxy/docker-gen:0.17.2
    container_name: muse-docker-gen
    restart: unless-stopped

    networks:
      - muse-net

    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./docker-gen/template.tmpl:/etc/docker-gen/templates/template.tmpl:ro

    command: -watch /etc/docker-gen/templates/template.tmpl /dev/null

    depends_on:
      - nginx

    labels:
      - "com.github.nginx-proxy.docker-gen=true"

  nginx:
    image: nginx:1.27-alpine
    container_name: muse-nginx
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    environment:
      - LETSENCRYPT_DOMAIN

    networks:
      - muse-net

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - muse-nginx-certs:/etc/nginx/certs
      - muse-nginx-html:/usr/share/nginx/html

    # Bootstrap: symlink domain-specific certs to generic names, or generate self-signed placeholder.
    # Acme-companion creates domain-specific certs (e.g., mydomain.duckdns.org.crt).
    # This entrypoint creates cert.pem/key.pem symlinks so nginx config stays static (git-safe).
    entrypoint: >
      /bin/sh -c '
        if [ -n "$LETSENCRYPT_DOMAIN" ] && [ -f "/etc/nginx/certs/$LETSENCRYPT_DOMAIN.crt" ]; then
          echo "[nginx] Linking $LETSENCRYPT_DOMAIN certs to generic names..."
          ln -sf "/etc/nginx/certs/$LETSENCRYPT_DOMAIN.crt" /etc/nginx/certs/cert.pem
          ln -sf "/etc/nginx/certs/$LETSENCRYPT_DOMAIN.key" /etc/nginx/certs/key.pem
        elif [ ! -f /etc/nginx/certs/cert.pem ]; then
          echo "[nginx] No certificate found, installing openssl and generating placeholder..."
          apk add --no-cache openssl
          openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
            -keyout /etc/nginx/certs/key.pem \
            -out /etc/nginx/certs/cert.pem \
            -subj "/CN=localhost"
          echo "[nginx] Placeholder certificate generated. Acme-companion will replace it."
        fi
        if [ -n "$LETSENCRYPT_DOMAIN" ]; then
          (
            while :; do
              if [ -f "/etc/nginx/certs/$LETSENCRYPT_DOMAIN.crt" ] && [ ! -L /etc/nginx/certs/cert.pem ]; then
                echo "[nginx] ACME certificate found; switching from placeholder..."
                ln -sf "/etc/nginx/certs/$LETSENCRYPT_DOMAIN.crt" /etc/nginx/certs/cert.pem
                ln -sf "/etc/nginx/certs/$LETSENCRYPT_DOMAIN.key" /etc/nginx/certs/key.pem
                nginx -s reload 2>/dev/null || true
                break
              fi
              sleep 5
            done
          ) &
        fi
        exec /docker-entrypoint.sh nginx -g "daemon off;"
      '

    depends_on:
      - vllm

  acme-companion:
    image: nginxproxy/acme-companion:2.8.2
    container_name: muse-acme
    restart: unless-stopped

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - muse-nginx-certs:/etc/nginx/certs
      - muse-nginx-html:/usr/share/nginx/html
      - muse-acme-data:/etc/acme.sh

    environment:
      - NGINX_PROXY_CONTAINER=muse-nginx
      - NGINX_DOCKER_GEN_CONTAINER=muse-docker-gen
      - DEFAULT_EMAIL=${LETSENCRYPT_EMAIL:-}

    networks:
      - muse-net

    depends_on:
      - nginx
      - docker-gen

networks:
  muse-net:
    attachable: true

volumes:
  muse-nginx-certs:
  muse-nginx-html:
  muse-acme-data:
